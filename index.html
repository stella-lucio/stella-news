<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="하루 한 장 어린이 신문">
<meta property="og:title" content="스텔라 하루신문">
<meta property="og:description" content="하루 한 장 어린이 신문">
<title>스텔라 하루신문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{
  --bg:#EAF0F7; --paper:#FFFFFF; --ink:#1D2B4F; --soft:#5A6784; --line:#D5DDEA;
  --moon:#FFC93C; --moonSoft:#FFF3CC; --green:#2F8F6A; --greenSoft:#E3F3EC;
  --red:#E0453A; --chip:#F1F4F9; --ok:#2F8F6A; --bad:#E0453A;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --meta:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1424; --paper:#172036; --ink:#E7ECF6; --soft:#A3AECA; --line:#2A3656;
    --moon:#FFD25E; --moonSoft:#3A3420; --green:#5CC49B; --greenSoft:#18352C;
    --red:#FF6B5E; --chip:#212C47; --ok:#5CC49B; --bad:#FF6B5E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1424; --paper:#172036; --ink:#E7ECF6; --soft:#A3AECA; --line:#2A3656;
  --moon:#FFD25E; --moonSoft:#3A3420; --green:#5CC49B; --greenSoft:#18352C;
  --red:#FF6B5E; --chip:#212C47; --ok:#5CC49B; --bad:#FF6B5E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
a{color:var(--green)}

/* masthead */
.mast{max-width:1120px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.moonmark{width:46px;height:46px;border-radius:50%;background:var(--moon);position:relative;flex:none;box-shadow:inset -8px -4px 0 rgba(0,0,0,.08)}
.moonmark::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.08);top:12px;left:12px;box-shadow:14px 10px 0 -1px rgba(0,0,0,.07)}
.brand h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.5px}
.brand p{margin:0;font-family:var(--meta);font-size:13px;color:var(--soft)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-family:var(--meta);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}

/* paper */
.paper{background:var(--paper);border-radius:6px;padding:28px clamp(18px,4vw,44px) 36px;border:1px solid var(--line)}
.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-family:var(--meta);font-size:13px;color:var(--soft);border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:22px}
.dateline b{color:var(--ink)}
.special{background:var(--moon);color:#1D2B4F;border-radius:4px;padding:0 8px;font-weight:600}
.sec{font-family:var(--meta);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--green);display:inline-block;margin-bottom:4px}
.art h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.3;margin:0 0 8px;text-wrap:balance}
.art p{margin:0 0 10px;max-width:62ch}
.art.lead h2{font-size:clamp(28px,4.2vw,38px)}
.art.lead p{font-size:18.5px}
.lead-wrap{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px 32px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .art:last-child:nth-child(odd){grid-column:1/-1;background:var(--greenSoft);border-radius:6px;padding:14px 18px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}

.saying{margin:26px 0 0;background:var(--moonSoft);border-radius:6px;padding:14px 18px;display:grid;gap:2px}
.saying q{font-family:var(--display);font-size:21px;quotes:"“" "”"}
.saying span{font-size:15px;color:var(--soft)}

/* activities */
.acts{margin-top:28px;display:grid;gap:22px}
.acts h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.acts h3 i{font-style:normal;font-family:var(--meta);font-size:12px;font-weight:600;background:var(--greenSoft);color:var(--green);border-radius:999px;padding:1px 9px}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:620px){.words{grid-template-columns:1fr}}
.word{background:var(--chip);border-radius:6px;padding:8px 12px;font-size:15.5px;line-height:1.55}
.word b{font-family:var(--display);font-weight:400;font-size:18px;margin-right:6px}
.quiz{display:grid;gap:14px;counter-reset:q}
.qitem{counter-increment:q}
.qitem p{margin:0 0 6px;font-weight:600}
.qitem p::before{content:counter(q) ". ";font-family:var(--meta);color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 14px;font-size:16px}
.opt:hover{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--greenSoft);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.qfeed{font-family:var(--meta);font-size:13px;margin-left:4px;min-height:1em}
.think{border:1.5px dashed var(--line);border-radius:6px;padding:14px 16px}
.think p{margin:0 0 8px}
.think textarea{width:100%;min-height:96px;border:none;background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);background-color:transparent;font:inherit;line-height:34px;color:var(--ink);resize:vertical;padding:0}
.think textarea:focus{outline:none}
.eng{display:grid;gap:2px;background:var(--chip);border-radius:6px;padding:14px 18px}
.eng .en{font-family:var(--meta);font-size:20px;font-weight:600;letter-spacing:.01em}
.eng .ko{color:var(--soft);font-size:15.5px}
.eng .wd{font-family:var(--meta);font-size:13px;color:var(--green);font-weight:600}

/* stamp */
.done{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;border-top:3px double var(--ink);padding-top:20px}
.stamp{width:108px;height:108px;border-radius:50%;border:4px solid var(--red);color:var(--red);display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:20px;line-height:1.15;transform:rotate(-12deg);opacity:.92}
.stamp small{display:block;font-family:var(--meta);font-size:10px;letter-spacing:.05em}
.stamp.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:rotate(-12deg) scale(1.6);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}}
.sources{margin-top:22px;font-family:var(--meta);font-size:12px;color:var(--soft)}
.sources ul{margin:4px 0 0;padding-left:18px}

/* side */
.side{display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.side{position:static}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.card h4{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.calnav{display:flex;gap:4px}
.calnav button{border:none;background:var(--chip);border-radius:6px;width:28px;height:28px;font-family:var(--meta)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-family:var(--meta);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.cal .h{color:var(--soft);font-size:11px}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;color:var(--soft);position:relative;border:none;background:none;padding:0;font-family:var(--meta);font-size:13px}
.cal .d.has{background:var(--chip);color:var(--ink);font-weight:600}
.cal .d.has:hover{outline:1.5px solid var(--ink)}
.cal .d.cur{background:var(--ink);color:var(--paper)}
.cal .d.st::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);top:3px;right:3px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--chip);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--meta);font-size:12px;color:var(--soft)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:260px;overflow:auto}
.list button{width:100%;text-align:left;border:none;background:none;border-radius:6px;padding:6px 8px;display:flex;gap:8px;align-items:baseline;font-size:15px;line-height:1.4}
.list button:hover{background:var(--chip)}
.list button.cur{background:var(--chip);font-weight:600}
.list time{font-family:var(--meta);font-size:12px;color:var(--soft);flex:none;font-variant-numeric:tabular-nums}
.list .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none;align-self:center}
.list .dot.off{background:transparent;border:1.5px solid var(--line)}
.note{font-family:var(--meta);font-size:12px;color:var(--soft);margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--meta);font-size:14px;padding:9px 16px;border-radius:999px}
.copybox{width:100%;min-height:120px;font-family:var(--meta);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header class="mast">
  <div class="brand">
    <div class="moonmark" aria-hidden="true"></div>
    <div>
      <h1>스텔라 하루신문</h1>
      <p>하루 한 장 어린이 신문</p>
    </div>
  </div>
  <div class="tools">
    <button class="btn" id="prevBtn" type="button">← 이전 호</button>
    <button class="btn" id="nextBtn" type="button">다음 호 →</button>
    <button class="btn" id="copyBtn" type="button">공유하기</button>
    <button class="btn primary" id="printBtn" type="button">인쇄하기</button>
  </div>
</header>

<div class="wrap">
  <main class="paper" id="paper" aria-live="polite"></main>
  <aside class="side">
    <section class="card">
      <h4>읽은 기록</h4>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>나온 신문</span></div>
        <div class="stat"><b id="stRead">0</b><span>다 읽은 날</span></div>
        <div class="stat"><b id="stStreak">0</b><span>연속 읽기</span></div>
      </div>
    </section>
    <section class="card">
      <h4><span id="calTitle"></span><span class="calnav"><button type="button" id="calPrev" aria-label="이전 달">‹</button><button type="button" id="calNext" aria-label="다음 달">›</button></span></h4>
      <div class="cal" id="cal"></div>
    </section>
    <section class="card">
      <h4>지난 신문</h4>
      <ul class="list" id="list"></ul>
    </section>
    <p class="note">빨간 점은 '다 읽었어요' 도장을 받은 날이에요. 도장 기록은 지금 보고 있는 기기에만 저장돼요.</p>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script>
function getJSON(u){ return fetch(u, { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
// 저장소 최신본을 먼저 읽어서 GitHub Pages 배포가 늦어도 새 호가 바로 보이게 한다
getJSON('https://raw.githubusercontent.com/stella-lucio/stella-news/main/issues.json?v=' + Date.now())
  .catch(function(){ return getJSON('issues.json?v=' + Date.now()); })
  .then(start)
  .catch(function(){ document.getElementById('paper').innerHTML = '<p>신문을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; });
function start(issues){
  issues.sort(function(a,b){ return a.date < b.date ? 1 : -1; }); // newest first
  var byId = {}; issues.forEach(function(i){ byId[i.id] = i; });

  var STORE = 'stella-news-v1';
  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ return {}; } }
  function save(s){ try { localStorage.setItem(STORE, JSON.stringify(s)); } catch(e){} }
  var state = load(); state.stamps = state.stamps || {}; state.notes = state.notes || {};

  var cur = null, calMonth = null;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(d){ var p = d.split('-'); return p[0] + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일'; }
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2200); }

  function renderIssue(){
    var i = cur, el = $('paper');
    if (!i){ el.innerHTML = '<p>아직 나온 신문이 없어요.</p>'; return; }
    var lead = i.articles.filter(function(a){ return a.lead; })[0] || i.articles[0];
    var rest = i.articles.filter(function(a){ return a !== lead; });
    function art(a, isLead){
      return '<article class="art' + (isLead ? ' lead' : '') + '"><span class="sec">' + esc(a.section) + '</span><h2>' + esc(a.headline) + '</h2>' +
        a.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</article>';
    }
    var stamped = !!state.stamps[i.id];
    var h = '';
    h += '<div class="dateline"><span><b>제' + i.no + '호</b> · ' + fmt(i.date) + ' ' + esc(i.weekday) + '요일' +
         (i.special ? ' <span class="special">' + esc(i.special) + '</span>' : '') + '</span>' +
         (i.weather ? '<span>오늘 날씨: ' + esc(i.weather) + '</span>' : '') + '</div>';
    h += '<div class="lead-wrap">' + art(lead, true) + '</div>';
    h += '<div class="grid">' + rest.map(function(a){ return art(a, false); }).join('') + '</div>';
    if (i.saying) h += '<div class="saying"><q>' + esc(i.saying.text) + '</q><span>' + esc(i.saying.meaning) + '</span></div>';
    h += '<div class="acts">';
    if (i.words && i.words.length) h += '<section><h3>낱말 풀이 <i>어려운 말</i></h3><div class="words">' +
        i.words.map(function(w){ return '<div class="word"><b>' + esc(w.w) + '</b>' + esc(w.m) + '</div>'; }).join('') + '</div></section>';
    if (i.quiz && i.quiz.length) h += '<section><h3>퀴즈 풀기 <i>' + i.quiz.length + '문제</i></h3><div class="quiz">' +
        i.quiz.map(function(q, qi){
          return '<div class="qitem"><p>' + esc(q.q) + '</p><div class="opts">' +
            q.options.map(function(o, oi){ return '<button type="button" class="opt" data-q="' + qi + '" data-o="' + oi + '">' + esc(o) + '</button>'; }).join('') +
            '<span class="qfeed" id="qf' + qi + '"></span></div></div>';
        }).join('') + '</div></section>';
    if (i.think) h += '<section><h3>생각 쓰기</h3><div class="think"><p>' + esc(i.think) + '</p><textarea id="think-' + esc(i.id) + '" aria-label="생각 쓰기">' + esc(state.notes[i.id] || '') + '</textarea></div></section>';
    if (i.english) h += '<section><h3>오늘의 영어 한 줄</h3><div class="eng"><span class="en">' + esc(i.english.en) + '</span><span class="ko">' + esc(i.english.ko) + '</span>' +
        (i.english.word ? '<span class="wd">' + esc(i.english.word) + '</span>' : '') + '</div></section>';
    h += '</div>';
    h += '<div class="done">' + (stamped
        ? '<div class="stamp" id="stamp">참 잘<br>했어요<small>' + esc(i.date.slice(5).replace('-', '.')) + '</small></div><button class="btn" type="button" id="unstamp">도장 지우기</button>'
        : '<button class="btn primary" type="button" id="stampBtn">다 읽었어요! 도장 받기</button><span class="note">기사를 다 읽고 퀴즈까지 풀면 눌러요.</span>') + '</div>';
    if (i.sources && i.sources.length) h += '<div class="sources">출처 (부모님 확인용)<ul>' +
        i.sources.map(function(s){ return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a></li>'; }).join('') + '</ul></div>';
    el.innerHTML = h;

    Array.prototype.forEach.call(el.querySelectorAll('.opt'), function(b){
      b.addEventListener('click', function(){
        var qi = +b.dataset.q, oi = +b.dataset.o, q = i.quiz[qi];
        var group = el.querySelectorAll('.opt[data-q="' + qi + '"]');
        if (oi === q.answer){
          Array.prototype.forEach.call(group, function(g){ g.disabled = true; });
          b.classList.add('ok'); $('qf' + qi).textContent = '정답이에요!';
        } else { b.classList.add('no'); b.disabled = true; $('qf' + qi).textContent = '다시 골라 볼까요?'; }
      });
    });
    var ta = el.querySelector('textarea');
    if (ta) ta.addEventListener('input', function(){ state.notes[i.id] = ta.value; save(state); });
    var sb = $('stampBtn');
    if (sb) sb.addEventListener('click', function(){ state.stamps[i.id] = true; save(state); renderAll(); var s = $('stamp'); if (s) s.classList.add('pop'); });
    var ub = $('unstamp');
    if (ub) ub.addEventListener('click', function(){ delete state.stamps[i.id]; save(state); renderAll(); });
  }

  function renderSide(){
    $('stTotal').textContent = issues.length;
    $('stRead').textContent = issues.filter(function(i){ return state.stamps[i.id]; }).length;
    var streak = 0; for (var k = 0; k < issues.length; k++){ if (state.stamps[issues[k].id]) streak++; else break; }
    $('stStreak').textContent = streak;

    var ym = calMonth, y = +ym.slice(0,4), m = +ym.slice(5,7);
    $('calTitle').textContent = y + '년 ' + m + '월';
    var first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    var c = ['일','월','화','수','목','금','토'].map(function(d){ return '<span class="h">' + d + '</span>'; }).join('');
    for (var b = 0; b < first; b++) c += '<span></span>';
    for (var d = 1; d <= days; d++){
      var id = ym + '-' + (d < 10 ? '0' : '') + d;
      if (byId[id]) c += '<button type="button" class="d has' + (cur && cur.id === id ? ' cur' : '') + (state.stamps[id] ? ' st' : '') + '" data-id="' + id + '" aria-label="' + fmt(id) + ' 신문">' + d + '</button>';
      else c += '<span class="d">' + d + '</span>';
    }
    $('cal').innerHTML = c;
    Array.prototype.forEach.call($('cal').querySelectorAll('button.d'), function(bt){ bt.addEventListener('click', function(){ go(bt.dataset.id); }); });

    $('list').innerHTML = issues.map(function(i){
      var lead = i.articles.filter(function(a){ return a.lead; })[0] || i.articles[0];
      return '<li><button type="button" data-id="' + i.id + '"' + (cur && cur.id === i.id ? ' class="cur"' : '') + '><span class="dot' + (state.stamps[i.id] ? '' : ' off') + '"></span><time>' + i.date.slice(5).replace('-', '.') + '</time><span>' + esc(lead.headline) + '</span></button></li>';
    }).join('');
    Array.prototype.forEach.call($('list').querySelectorAll('button'), function(bt){ bt.addEventListener('click', function(){ go(bt.dataset.id); }); });

    var idx = issues.indexOf(cur);
    $('prevBtn').disabled = idx < 0 || idx >= issues.length - 1;
    $('nextBtn').disabled = idx <= 0;
    var months = issues.map(function(i){ return i.date.slice(0,7); });
    $('calPrev').disabled = !months.some(function(x){ return x < calMonth; });
    $('calNext').disabled = !months.some(function(x){ return x > calMonth; });
  }

  function renderAll(){ renderIssue(); renderSide(); }
  function go(id){
    if (!byId[id]) return;
    cur = byId[id]; calMonth = id.slice(0,7);
    try { history.replaceState(null, '', '#d' + id); } catch(e){}
    renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function shiftMonth(dir){
    var months = issues.map(function(i){ return i.date.slice(0,7); }).filter(function(x, k, a){ return a.indexOf(x) === k; }).sort();
    var k = months.indexOf(calMonth) + dir;
    if (months.indexOf(calMonth) < 0) k = dir > 0 ? 0 : months.length - 1;
    if (months[k]){ calMonth = months[k]; renderSide(); }
  }

  $('prevBtn').addEventListener('click', function(){ var k = issues.indexOf(cur); if (issues[k + 1]) go(issues[k + 1].id); });
  $('nextBtn').addEventListener('click', function(){ var k = issues.indexOf(cur); if (k > 0) go(issues[k - 1].id); });
  $('calPrev').addEventListener('click', function(){ shiftMonth(-1); });
  $('calNext').addEventListener('click', function(){ shiftMonth(1); });

  function plainText(i){
    var t = '[스텔라 하루신문 제' + i.no + '호 · ' + fmt(i.date) + ']\n\n';
    i.articles.forEach(function(a){ t += '■ ' + a.headline + '\n' + a.body.join(' ') + '\n\n'; });
    if (i.quiz) t += '퀴즈\n' + i.quiz.map(function(q, k){ return (k + 1) + '. ' + q.q + ' (' + q.options.join(' / ') + ')'; }).join('\n') + '\n\n';
    if (i.english) t += 'Today\'s English: ' + i.english.en + ' (' + i.english.ko + ')';
    return t;
  }
  $('copyBtn').addEventListener('click', function(){
    if (!cur) return;
    var url = location.origin + location.pathname + '#d' + cur.id;
    var lead = cur.articles.filter(function(a){ return a.lead; })[0] || cur.articles[0];
    var title = '스텔라 하루신문 제' + cur.no + '호';
    if (navigator.share){
      navigator.share({ title: title, text: title + ' · ' + lead.headline, url: url }).catch(function(){});
      return;
    }
    var txt = title + ' · ' + lead.headline + '\n' + url;
    function fallback(){
      var box = document.createElement('textarea'); box.className = 'copybox'; box.value = txt; box.readOnly = true;
      $('paper').appendChild(box); box.focus(); box.select(); toast('링크를 길게 눌러 복사해 주세요');
    }
    try { navigator.clipboard.writeText(txt).then(function(){ toast('링크를 복사했어요. 카톡에 붙여넣기 하면 돼요'); }, fallback); } catch(e){ fallback(); }
  });

  function printDoc(i){
    function art(a){ return '<article' + (a.lead ? ' class="lead"' : '') + '><span class="sec">' + esc(a.section) + '</span><h2>' + esc(a.headline) + '</h2>' + a.body.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</article>'; }
    var lead = i.articles.filter(function(a){ return a.lead; })[0] || i.articles[0];
    var rest = i.articles.filter(function(a){ return a !== lead; });
    var lines = function(n){ var s = ''; for (var k = 0; k < n; k++) s += '<div class="ln"></div>'; return s; };
    return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>스텔라 하루신문 제' + i.no + '호</title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">' +
      '<style>@page{size:A4;margin:12mm 13mm}*{box-sizing:border-box}body{margin:0;color:#1D2B4F;font-family:"Gowun Dodum","Malgun Gothic",sans-serif;font-size:10.8pt;line-height:1.62;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.bar{display:flex;justify-content:center;padding:10px;background:#EAF0F7;margin-bottom:12px}.bar button{font:inherit;font-size:14pt;padding:8px 22px;border-radius:999px;border:0;background:#1D2B4F;color:#fff;cursor:pointer}@media print{.bar{display:none}}' +
      '.page{max-width:184mm;margin:0 auto}.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #1D2B4F;padding-bottom:4px;margin-bottom:10px}' +
      '.mast h1{font-family:Jua,sans-serif;font-weight:400;font-size:26pt;margin:0;line-height:1}.mast div{font-size:9pt;text-align:right}.sp{background:#FFC93C;padding:0 5px;border-radius:3px}' +
      '.sec{font-size:8pt;font-weight:700;color:#2F8F6A;letter-spacing:.08em}h2{font-family:Jua,sans-serif;font-weight:400;font-size:14.5pt;margin:0 0 3px;line-height:1.3}p{margin:0 0 4px}' +
      '.lead h2{font-size:19pt}.lead{border-bottom:1px solid #C9D2E2;padding-bottom:8px;margin-bottom:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}' +
      '.say{background:#FFF3CC;padding:6px 10px;margin:10px 0;border-radius:4px}.say b{font-family:Jua,sans-serif;font-weight:400;font-size:12.5pt}' +
      '.act{border:1.5px solid #1D2B4F;border-radius:6px;padding:8px 12px;margin-top:8px;break-inside:avoid}.act h3{font-family:Jua,sans-serif;font-weight:400;font-size:13pt;margin:0 0 4px}' +
      '.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.w b{font-family:Jua,sans-serif;font-weight:400}.q{margin-bottom:4px}.q span{display:inline-block;margin-right:12px}' +
      '.ln{border-bottom:1px solid #9AA6BF;height:9mm}.draw{height:42mm;border:1px dashed #9AA6BF;border-radius:4px}.en{font-size:13pt;font-weight:700}.trace{font-size:15pt;color:#C9D2E2;letter-spacing:.04em;border-bottom:1px solid #9AA6BF;margin-top:2px}' +
      '.ans{font-size:8pt;color:#5A6784;margin-top:6px;text-align:right}.p2{break-before:page;page-break-before:always}.mast.small h1{font-size:18pt}.p2 .act{margin-top:10px}.p2 .ln{height:10mm}.p2 .draw{height:70mm}.stampbox{float:right;width:22mm;height:22mm;border:1.5px dashed #E0453A;border-radius:50%;color:#E0453A;font-size:7pt;display:grid;place-items:center;text-align:center;line-height:1.2}</style></head><body>' +
      '<div class="bar"><button onclick="window.print()">인쇄하기</button></div><div class="page">' +
      '<div class="mast"><h1>스텔라 하루신문</h1><div>제' + i.no + '호 · ' + fmt(i.date) + ' ' + esc(i.weekday) + '요일' + (i.special ? ' <span class="sp">' + esc(i.special) + '</span>' : '') + (i.weather ? '<br>날씨: ' + esc(i.weather) : '') + '</div></div>' +
      art(lead) + '<div class="cols">' + rest.map(art).join('') + '</div>' +
      '<div class="p2"><div class="mast small"><h1>스텔라 하루신문 · 활동지</h1><div>제' + i.no + '호 · ' + fmt(i.date) + '<br>이름: ____________</div></div>' + (i.saying ? '<div class="say"><b>“' + esc(i.saying.text) + '”</b> ' + esc(i.saying.meaning) + '</div>' : '') + '<div class="two"><div class="act"><h3>낱말 풀이</h3>' + (i.words || []).map(function(w){ return '<div class="w"><b>' + esc(w.w) + '</b> ' + esc(w.m) + '</div>'; }).join('') + '</div>' +
      '<div class="act"><h3>퀴즈</h3>' + (i.quiz || []).map(function(q, k){ return '<div class="q">' + (k + 1) + '. ' + esc(q.q) + '<br>' + q.options.map(function(o, oi){ return '<span>' + '①②③④'[oi] + ' ' + esc(o) + '</span>'; }).join('') + '</div>'; }).join('') + '</div></div>' +
      '<div class="two"><div class="act"><h3>생각 쓰기</h3><p>' + esc(i.think || '') + '</p>' + lines(6) + '</div>' +
      '<div class="act"><h3>그림 그리기</h3><p>' + esc(i.draw || '오늘 기사에서 떠오르는 장면을 그려 보세요.') + '</p><div class="draw"></div></div></div>' +
      (i.english ? '<div class="act"><span class="stampbox">부모님<br>확인</span><h3>오늘의 영어 한 줄</h3><div class="en">' + esc(i.english.en) + '</div><div>' + esc(i.english.ko) + (i.english.word ? ' · ' + esc(i.english.word) : '') + '</div><div class="trace">' + esc(i.english.en) + '</div></div>' : '') +
      '<div class="ans">퀴즈 정답: ' + (i.quiz || []).map(function(q, k){ return (k + 1) + '번 ' + '①②③④'[q.answer]; }).join(', ') + '</div>' +
      '</div></div><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},600)})<\/script></body></html>';
  }

  $('printBtn').addEventListener('click', function(){
    if (!cur) return;
    var w = window.open('', '_blank');
    if (!w){ toast('팝업이 막혀 있어요. 팝업을 허용해 주세요'); return; }
    w.document.open(); w.document.write(printDoc(cur)); w.document.close();
  });

  var h = (location.hash || '').replace(/^#d/, '');
  cur = byId[h] || issues[0] || null;
  calMonth = cur ? cur.id.slice(0,7) : new Date().toISOString().slice(0,7);
  renderAll();
  window.addEventListener('hashchange', function(){ var x = (location.hash || '').replace(/^#d/, ''); if (byId[x] && (!cur || cur.id !== x)) go(x); });
}
</script>
</body>
</html>
